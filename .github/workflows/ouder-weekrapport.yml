name: Ouder-weekrapport (vrijdag 16:00)

# Mark 30 sep 2026: het weekrapport voor ouders elke VRIJDAG om 16:00 Nederlandse tijd, "net als
# mijn dagrapport maar dan over het kind". Vercel Hobby heeft maar 2 crons (allebei bezet), dus
# GitHub Actions — zoals de uptime-bewaking. Cron loopt in UTC; we starten om 14:00 én 15:00 UTC
# en sturen alleen als het in Amsterdam echt 16 uur is (zomer-/wintertijd). Het endpoint stempelt
# admin_meta, dus dubbel versturen kan sowieso niet.
#
# 2 okt 2026: de eerste echte vrijdag ging NIET uit — GitHub sloeg beide geplande runs over
# (de uptime-bewaking op */5 draait in de praktijk ook maar een paar keer per dag). Daarom nu
# zes startmomenten tussen 14:00 en 16:40 UTC en een venster vanaf 16:00 Amsterdam: de
# eerste run die in het venster valt verstuurt, de rest stuit op de datumstempel.
# Zelfde avond bleek de 16:40-UTC-start pas om 20:57 Amsterdam te draaien (2 u 17 min te laat)
# -> venster verruimd naar 16:00-21:59.
#
# Vereist GitHub-secret CRON_SECRET (dezelfde waarde als de Vercel env-var CRON_SECRET).

on:
  schedule:
    - cron: "0 14 * * 5"
    - cron: "30 14 * * 5"
    - cron: "0 15 * * 5"
    - cron: "30 15 * * 5"
    - cron: "10 16 * * 5"
    - cron: "40 16 * * 5"
  workflow_dispatch:
    inputs:
      echt:
        description: "Echt versturen? (standaard nee = droge test: sleutel + kandidaten, geen mail)"
        type: boolean
        default: false

concurrency:
  group: ouder-weekrapport
  cancel-in-progress: false

jobs:
  stuur:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Alleen tussen 16:00 en 21:59 Amsterdam (of handmatig)
        id: tijd
        run: |
          UUR=$(TZ=Europe/Amsterdam date +%H)
          echo "Amsterdam-uur: $UUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$UUR" -ge 16 ] && [ "$UUR" -le 21 ]; }; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; fi
      - name: Weekrapporten versturen
        if: steps.tijd.outputs.go == '1'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::GitHub-secret CRON_SECRET ontbreekt"; exit 1; fi
          URL="https://leerkwartier.app/api/send-ouder-rapport"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.echt }}" != "true" ]; then URL="$URL?droog=1"; echo "Droge test — er wordt niets verstuurd"; fi
          code=$(curl -s -o /tmp/uit.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$URL")
          echo "HTTP $code"; cat /tmp/uit.json; echo
          [ "$code" = "200" ]
