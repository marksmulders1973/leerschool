<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Wereldbol-opname</title>
<style>
  html,body{margin:0;background:#0a0f1e;}
  /* De les-bol rendert vast op 360 px hoog; voor de video schalen we het hele
     blok 2,4× op (dpr 2 in Playwright houdt 'm scherp). */
  #globe-wrap { position:absolute !important; left:0; right:0; top:200px !important; height:360px !important; transform: scale(2.1); transform-origin: 50% 0%; }
  #globe-wrap button, #globe-wrap input, #globe-wrap select, #globe-wrap label, #globe-wrap p { display: none !important; }
  #globe-wrap canvas { display:block; }
</style>
</head><body><div id="root"></div><script src="/out.js"></script></body></html>
