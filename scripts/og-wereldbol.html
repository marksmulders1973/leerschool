<!doctype html>
<!-- Bron voor de OG-preview-afbeelding van de draaibare wereldbol.
     Render naar public/og/wereldbol.png op 1200×630 (Playwright screenshot). -->
<html lang="nl">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: linear-gradient(150deg, #0f1729 0%, #162033 48%, #1a2744 100%);
    color: #e8eef7; position: relative;
    display: flex; align-items: center;
  }
  /* sterren */
  .star { position: absolute; background: #fff; border-radius: 50%; opacity: .5; }
  .txt { width: 620px; padding: 0 0 0 70px; z-index: 2; }
  .eyebrow {
    display: inline-block; font-size: 22px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: #06211a;
    background: linear-gradient(135deg, #00e676, #69f0ae);
    padding: 8px 18px; border-radius: 999px; margin-bottom: 26px;
  }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 900; color: #fff; letter-spacing: -1px; }
  h1 .accent { color: #5bd16a; }
  p.sub { font-size: 31px; line-height: 1.35; color: rgba(255,255,255,.86); margin-top: 24px; font-weight: 500; }
  .brand { display: flex; align-items: center; gap: 14px; margin-top: 40px; }
  .brand .dot { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg,#5bd16a,#00e676); }
  .brand b { font-size: 27px; color: #fff; font-weight: 800; }
  .brand span { font-size: 24px; color: rgba(255,255,255,.6); }
  .globe-wrap { position: absolute; right: -40px; top: 50%; transform: translateY(-50%); width: 560px; height: 560px; z-index: 1; }
  .glow { position: absolute; inset: 40px; border-radius: 50%; background: radial-gradient(circle at 38% 34%, rgba(91,209,106,.30), rgba(0,0,0,0) 62%); filter: blur(6px); }
</style>
</head>
<body>
  <div class="txt">
    <div class="eyebrow">Nieuw · gratis</div>
    <h1>De draaibare <span class="accent">wereldbol</span> 🌍</h1>
    <p class="sub">Sleep en draai de aarde, tik op een werelddeel en raad welk het is.</p>
    <div class="brand">
      <div class="dot"></div>
      <b>Leerkwartier</b><span>· leerkwartier.app</span>
    </div>
  </div>

  <div class="globe-wrap">
    <div class="glow"></div>
    <svg width="560" height="560" viewBox="0 0 560 560">
      <defs>
        <radialGradient id="ocean" cx="40%" cy="35%" r="75%">
          <stop offset="0%" stop-color="#1d4a66"/>
          <stop offset="70%" stop-color="#15384f"/>
          <stop offset="100%" stop-color="#0c2433"/>
        </radialGradient>
        <radialGradient id="shine" cx="36%" cy="30%" r="60%">
          <stop offset="0%" stop-color="rgba(255,255,255,.35)"/>
          <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>
        <clipPath id="ball"><circle cx="280" cy="280" r="232"/></clipPath>
      </defs>

      <!-- buiten-gloed -->
      <circle cx="280" cy="280" r="244" fill="none" stroke="rgba(91,209,106,.35)" stroke-width="3"/>
      <!-- oceaan -->
      <circle cx="280" cy="280" r="232" fill="url(#ocean)"/>

      <g clip-path="url(#ball)">
        <!-- continenten in app-kleuren (organische blobs) -->
        <!-- Noord-Amerika (geel) -->
        <path fill="#f2d24b" d="M150 150 q-40 30 -34 70 q6 36 40 44 q22 6 30 30 q10 26 34 20 q18 -4 14 -34 q-6 -40 -28 -64 q-26 -28 -22 -52 q4 -22 -34 -14z"/>
        <!-- Zuid-Amerika (paars) -->
        <path fill="#a07bf0" d="M214 330 q-20 18 -14 56 q6 40 30 70 q16 20 30 8 q12 -12 6 -44 q-6 -34 4 -56 q10 -24 -16 -38 q-28 -14 -46 4z"/>
        <!-- Afrika (oranje) -->
        <path fill="#f0a030" d="M300 250 q-26 6 -28 44 q-2 36 18 70 q14 24 34 18 q18 -6 20 -38 q2 -30 16 -52 q14 -24 -10 -42 q-28 -20 -50 0z"/>
        <!-- Europa (groen) -->
        <path fill="#5bd16a" d="M300 196 q-16 -6 -26 12 q-8 18 8 30 q16 10 34 2 q16 -8 10 -28 q-6 -20 -26 -16z"/>
        <!-- Azië (rood) -->
        <path fill="#e85c5c" d="M348 168 q40 -16 78 8 q34 22 28 58 q-4 30 -34 34 q-30 4 -52 -8 q-26 -14 -44 -8 q-22 6 -22 -20 q0 -28 22 -44 q18 -14 26 -28z"/>
        <!-- Oceanië (roze) -->
        <circle cx="430" cy="392" r="26" fill="#ff8fb0"/>
        <circle cx="468" cy="360" r="12" fill="#ff8fb0"/>

        <!-- meridiaan/parallel-lijntjes voor 3D-gevoel -->
        <g fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2">
          <ellipse cx="280" cy="280" rx="232" ry="80"/>
          <ellipse cx="280" cy="280" rx="232" ry="160"/>
          <ellipse cx="280" cy="280" rx="80" ry="232"/>
          <ellipse cx="280" cy="280" rx="160" ry="232"/>
        </g>
        <!-- glans -->
        <circle cx="280" cy="280" r="232" fill="url(#shine)"/>
      </g>
    </svg>
  </div>

  <script>
    // strooi wat sterren
    const b = document.body;
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const sz = Math.random() * 2.4 + 0.6;
      s.style.width = s.style.height = sz + 'px';
      s.style.left = (Math.random() * 640) + 'px';
      s.style.top = (Math.random() * 630) + 'px';
      s.style.opacity = (Math.random() * 0.5 + 0.2);
      b.appendChild(s);
    }
  </script>
</body>
</html>
