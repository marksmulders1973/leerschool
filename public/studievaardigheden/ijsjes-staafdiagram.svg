<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-label="Staafdiagram: verkochte ijsjes per dag (maandag, dinsdag, woensdag, donderdag). Lees de hoogte van de staven af.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fc"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eb8ff"/>
      <stop offset="1" stop-color="#2f7fe0"/>
    </linearGradient>
    <linearGradient id="barHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="bsh" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="280" rx="18" fill="url(#card)"/>
  <text x="32" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#15314f">🍦 Verkochte ijsjes deze week</text>

  <!-- y-as raster (zonder cijfers op de staven; de as geeft de schaal) -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#9aa9bd">
    <line x1="58" y1="48"  x2="372" y2="48"  stroke="#eef2f7"/><text x="50" y="52"  text-anchor="end">50</text>
    <line x1="58" y1="81"  x2="372" y2="81"  stroke="#eef2f7"/><text x="50" y="85"  text-anchor="end">40</text>
    <line x1="58" y1="114" x2="372" y2="114" stroke="#eef2f7"/><text x="50" y="118" text-anchor="end">30</text>
    <line x1="58" y1="147" x2="372" y2="147" stroke="#eef2f7"/><text x="50" y="151" text-anchor="end">20</text>
    <line x1="58" y1="180" x2="372" y2="180" stroke="#eef2f7"/><text x="50" y="184" text-anchor="end">10</text>
  </g>
  <line x1="58" y1="214" x2="372" y2="214" stroke="#cdd8e6" stroke-width="2"/>
  <line x1="58" y1="48"  x2="58"  y2="214" stroke="#cdd8e6" stroke-width="2"/>

  <!-- staven: ronde toppen, gradiënt, schaduw. GEEN cijfers erop. wo = hoogste, accent. -->
  <g filter="url(#bsh)">
    <rect x="80"  y="147.6" width="46" height="66.4"  rx="9" fill="url(#bar)"/>
    <rect x="158" y="97.8"  width="46" height="116.2" rx="9" fill="url(#bar)"/>
    <rect x="236" y="48"    width="46" height="166"   rx="9" fill="url(#barHi)"/>
    <rect x="314" y="164.2" width="46" height="49.8"  rx="9" fill="url(#bar)"/>
  </g>
  <!-- glans op elke staaf -->
  <g fill="#ffffff" opacity="0.25">
    <rect x="86"  y="153" width="9" height="55"  rx="4"/>
    <rect x="164" y="103" width="9" height="105" rx="4"/>
    <rect x="242" y="54"  width="9" height="155" rx="4"/>
    <rect x="320" y="170" width="9" height="40"  rx="4"/>
  </g>

  <!-- dag-labels -->
  <g font-family="Arial, sans-serif" font-size="12.5" fill="#42526b" text-anchor="middle" font-weight="600">
    <text x="103" y="234">maandag</text>
    <text x="181" y="234">dinsdag</text>
    <text x="259" y="234">woensdag</text>
    <text x="337" y="234">donderdag</text>
  </g>
</svg>
