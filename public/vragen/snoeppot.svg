<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-label="Een snoeppot vol kleurige snoepjes">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#ffe1ec"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#cfe8fb" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="deksel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ed0ff"/>
      <stop offset="1" stop-color="#3aa7f0"/>
    </linearGradient>
    <filter id="ss" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="7" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="360" height="320" rx="20" fill="url(#sbg)"/>
  <circle cx="290" cy="70" r="40" fill="#ffffff" opacity="0.5"/>
  <circle cx="60" cy="270" r="28" fill="#ffffff" opacity="0.45"/>

  <!-- schaduw -->
  <ellipse cx="180" cy="298" rx="92" ry="15" fill="#9a6a2a" opacity="0.14"/>

  <g filter="url(#ss)">
    <!-- pot -->
    <path d="M96 110 q0 -14 14 -14 h140 q14 0 14 14 v150 q0 24 -24 24 h-120 q-24 0 -24 -24 z" fill="url(#glas)" stroke="#bfe0f5" stroke-width="2"/>

    <!-- snoepjes (clip binnen de pot via groep) -->
    <g>
      <circle cx="132" cy="168" r="17" fill="#ff5d73"/>
      <circle cx="172" cy="158" r="17" fill="#ffb02e"/>
      <circle cx="212" cy="170" r="17" fill="#3ec46d"/>
      <circle cx="150" cy="200" r="17" fill="#7b6cff"/>
      <circle cx="192" cy="202" r="17" fill="#ff7ac0"/>
      <circle cx="230" cy="200" r="16" fill="#ffd23f"/>
      <circle cx="128" cy="232" r="16" fill="#28c0d6"/>
      <circle cx="166" cy="238" r="17" fill="#ff5d73"/>
      <circle cx="206" cy="238" r="17" fill="#7b6cff"/>
      <circle cx="240" cy="234" r="15" fill="#3ec46d"/>
      <circle cx="146" cy="266" r="15" fill="#ffb02e"/>
      <circle cx="186" cy="268" r="15" fill="#28c0d6"/>
      <circle cx="224" cy="266" r="15" fill="#ff7ac0"/>
      <!-- glanspuntjes -->
      <g fill="#ffffff" opacity="0.55">
        <circle cx="126" cy="162" r="4"/><circle cx="166" cy="152" r="4"/><circle cx="206" cy="164" r="4"/>
        <circle cx="144" cy="194" r="4"/><circle cx="186" cy="196" r="4"/>
      </g>
    </g>

    <!-- glas-highlight -->
    <path d="M110 116 q-4 60 2 150" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.5" fill="none"/>

    <!-- deksel -->
    <rect x="92" y="86" width="176" height="26" rx="13" fill="url(#deksel)"/>
    <rect x="150" y="70" width="60" height="22" rx="11" fill="url(#deksel)"/>
    <ellipse cx="180" cy="90" rx="84" ry="7" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>
